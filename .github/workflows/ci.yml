name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contracts:
    name: Soroban Smart Contract Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Contract Tests
        working-directory: contracts/escrow
        run: cargo test --verbose --locked

      - name: Build Contract WASM
        working-directory: contracts/escrow
        run: cargo build --target wasm32-unknown-unknown --release --locked

  node-packages:
    name: TypeScript Workspaces & PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: milestonepay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/milestonepay_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma Migrations to PostgreSQL
        run: npx prisma migrate deploy --schema=./apps/api/prisma/schema.prisma

      - name: Run Workspace Typecheck
        run: npm run typecheck

      - name: Run PostgreSQL Integration Tests
        run: npm run test:db --workspace=@milestone-pay/api

      - name: Run All Workspace Tests
        run: npm run test

      - name: Run SDK Mutual-Refund Coordination Example
        run: npm run example:mutual-refund --workspace=@milestone-pay/sdk

      - name: Build All Workspaces
        run: npm run build
